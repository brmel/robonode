name: CI

on:
  push:
  pull_request:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Module boundary lint
        run: bash scripts/check-boundaries.sh

  robonode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (full package incl. UR adapter)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  robonode-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan/UBSan (UR adapter off — sanitizing urcl is not our job)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DROBONODE_BUILD_UR_ADAPTER=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  trajectory-lab:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags:
          - ""
          - "-DCMAKE_CXX_FLAGS=-fsanitize=thread"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S trajectory-lab -B trajectory-lab/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build trajectory-lab/build -j
      - name: Test
        run: ctest --test-dir trajectory-lab/build --output-on-failure

  # Compile-only: needs URSim at runtime.
  ur-playground-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ur-stream-playground -B ur-stream-playground/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ur-stream-playground/build -j
